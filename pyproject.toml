[project]
name = "jarvis"
version = "0.1.0"
description = "A fast, fully local voice companion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
tasks = ["pillow>=10", "pycaw>=20240210; platform_system == 'Windows'"]  # screenshots, volume
accounts = ["keyring>=24"]  # email and calendar
all = ["jarvis[voice,tasks,accounts]"]
voice = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pynput>=1.7",
    "piper-tts>=1.3",
    "openwakeword>=0.6",
    "pillow>=10",
    # CUDA libraries for GPU speech recognition; without an NVIDIA GPU the CPU is used.
    "nvidia-cublas-cu12; platform_system == 'Windows' or platform_system == 'Linux'",
    "nvidia-cudnn-cu12; platform_system == 'Windows' or platform_system == 'Linux'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
