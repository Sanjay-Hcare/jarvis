# Copy this file to config.toml and edit it. config.toml is not committed.
# Every setting is optional; anything you leave out uses the default shown.

assistant_name = "Jarvis"
user_name = "friend"          # what the assistant calls you

model = "llama3.2:3b"          # any chat model you have pulled in Ollama
ollama_host = "http://127.0.0.1:11434"
temperature = 0.7
keep_alive = "30m"             # how long the model stays loaded between replies
max_turns = 12                 # past exchanges remembered within one conversation
