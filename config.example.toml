# Copy this file to config.toml and edit it. config.toml is not committed.
# Every setting is optional; anything you leave out uses the default shown.

assistant_name = "Jarvis"
user_name = "friend"          # what the assistant calls you

model = "llama3.2:3b"          # any chat model you have pulled in Ollama
ollama_host = "http://127.0.0.1:11434"
temperature = 0.7
keep_alive = "30m"             # how long the model stays loaded between replies
max_turns = 12                 # past exchanges remembered within one conversation

# Voice input (python -m jarvis --voice)
stt_model = "small"           # tiny, base, small, medium: bigger is more accurate, slower
stt_device = "auto"           # auto uses an NVIDIA GPU when available, otherwise the CPU
stt_language = "en"           # "" lets Whisper detect the language
push_to_talk_key = "ctrl_r"   # hold while speaking: ctrl_r, alt_r, f9, ...
min_record_seconds = 0.4
wake_word = false             # true: say "Hey Jarvis" instead of holding the key (same as --wake)
wake_threshold = 0.5          # higher means fewer false wake-ups but more misses
wake_beep = true              # short tone when it starts listening
wake_models_dir = "data/wakeword"

# Voice output
speak = true                  # false gives text replies only
tts_voice = "en_GB-alan-medium"  # any voice from https://rhasspy.github.io/piper-samples/
tts_speed = 1.0               # above 1 talks faster
voices_dir = "data/voices"

# Memory: facts it learns about you, kept only in this file on your computer
remember = true
memory_path = "data/memory.json"
max_facts = 100

# Tasks: time, weather, opening apps, screenshots, locking the screen
use_tools = true
home_city = ""                # used for the weather when you don't name a city
screenshot_folder = ""        # empty means Pictures/Jarvis in your home folder

# Email and calendar, read-only. Run  python -m jarvis.setup_accounts  to store
# the password and calendar link in your system credential store.
email_address = ""            # for example you@gmail.com
imap_host = "imap.gmail.com"
keyring_service = "jarvis"
email_recent_days = 2         # "new mail" means unread mail from this many days
